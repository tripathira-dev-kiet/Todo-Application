<!DOCTYPE html>
<html>
<body>

  <h2>To-Do List</h2>

  <input type="text" id="task">
  <button onclick="add()">Add</button>

  <p>Pending: <b id="p">0</b> Completed: <b id="c">0</b></p>

  <ul id="list"></ul>

  <script>
    function add() {
      let input = document.getElementById("task");
      if (input.value == "") return;

      // New item list me add karo
      let li = document.createElement("li");
      li.innerHTML = `
        <input type="checkbox" onclick="update()"> ${input.value}
        <button onclick="this.parentElement.remove(); update();">Delete</button>
      `;
      document.getElementById("list").appendChild(li);

      input.value = "";
      update();
    }

    function update() {
      let total = document.querySelectorAll('#list li').length;
      let completed = document.querySelectorAll('#list input:checked').length;

      document.getElementById("c").innerText = completed;
      document.getElementById("p").innerText = total - completed;
    }
  </script>

</body>
</html>
